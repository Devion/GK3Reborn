name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build, test and package all three platforms. The archives land on the run's summary
  # page as artifacts, so any change can be downloaded and played without a tag being cut.
  build:
    uses: ./.github/workflows/build.yml

  # Its own job rather than a step in the matrix: it reads the index, not the build, so
  # running it three times told us the same thing three times and put a platform's name on
  # a failure that has nothing to do with any platform.
  guard:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed game data
        shell: bash
        run: |
          # Belt and braces over .gitignore: original assets must never be committed.
          if git ls-files | grep -iE '\.(brn|bik|avi|mod|act|anm|yak|mul|bsp|nvc|sif|scn|shp|gas|fon|cur|gk3)$'; then
            echo "::error::Original game data must never be committed. See CONTRIBUTING.md."
            exit 1
          fi

      # .gitignore does not apply to a file already tracked, which is how seven publish
      # outputs - a native .so among them - came to live under src/GK3Reborn.Host. The
      # builds are downloadable from this workflow now, so nothing has to be committed to
      # be shared, and this stops the next one going in.
      - name: Check for committed build output
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(bin|obj|publish|publishlinux|publishmac|artifacts)/'; then
            echo "::error::Build output must not be committed. Download it from the CI run instead."
            exit 1
          fi
